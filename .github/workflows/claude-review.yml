# 2 단계 (읽기 전용 AI): PR 증명 리뷰어. 코드를 바꾸지 않고 댓글만 단다.
# 에이전트가 연 draft PR 은 사람이 "Ready for review" 로 바꿀 때 리뷰가 돈다.
# App 토큰은 additional_permissions 로 contents 읽기에 한정한다 (push 불가).
name: Claude proof review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Dependabot PR 실행에는 Claude secret 이 없다 (Dependabot secret 만 주어짐).
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: read   # 출력 확인 단계 (워크플로 토큰) 용
      issues: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      # 인증 준비 확인 (값은 출력하지 않는다. secret 이 비었는지만 본다) 과 시작 시각 기록.
      - name: Check Claude credentials
        id: pre
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret 이 없다. Claude GitHub App 설치와 secret 등록이 필요하다 (README 의 1 회 설정)."
            exit 1
          fi
          echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PR 댓글은 pull_requests 쓰기로 충분하다. issues 는 읽기로 내려 유출 시 피해를 줄인다.
          additional_permissions: |
            contents: read
            issues: read
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.base_ref }}

            너는 이 PR 의 독립 검증자다. 규칙은 PR 이 아니라 base 의 것을 쓴다:
            `git show origin/${{ github.base_ref }}:AGENTS.md` 로 읽어라. 코드를 고치지 말고 의견만 남긴다.
            빌드와 공리 감사는 CI 가 판정한다. "검증되었다", "증명되었다" 고 쓰지 말고, 필요하면 CI 결과를 확인하라고 적는다.

            점검할 것:
            1. 진술 어긋남: 바뀐 SmarandacheWellin/*.lean 의 각 정리와 blueprint/src/content.tex 의 대응 노드
               (\lean{...}) 를 대조한다. 가정, 첨자 (Nat.nth Nat.Prime n = p_{n+1}), 양화사 ("무한히 많다" =
               ∀ M, ∃ n, M < n ∧ ...), 함의 방향이 같은지 본다.
            2. 숨은 가정: 새 정리가 쓰는 증명되지 않은 가정을 모두 나열한다. 이름 붙인 `def ... : Prop` 가 아닌 형태
               (구조체 필드, 인스턴스 인자, 생성자에 묶인 조건, axiom) 로 들어온 가정이 있으면 지적한다.
            3. 세 곳 규칙: 새 선언마다 Audit.lean 의 #print axioms 줄과 블루프린트 노드가 있는지.
            4. 문서: docs/lemma-ledger.md 나 README.md 가 바뀌었다면 Lean 이름과 상태가 실제와 맞는지.
            5. 에이전트 PR (작성자가 봇이거나 claude/ 브랜치) 이면 보호된 파일 (AGENTS.md 의 목록) 을 건드렸는지.

            출력: `gh pr comment` 로 한국어 댓글 하나를 단다. 항목마다 ✅ / ⚠️ / ❌ 와 근거 (파일:줄) 를 적는다.
            특정 줄의 문제는 mcp__github_inline_comment__create_inline_comment 로 인라인 댓글을 단다.
            문제가 없으면 짧게 그렇다고 쓴다.
            요약 댓글의 마지막 줄에 완료 표식 [sw-done:${{ github.run_id }}.${{ github.run_attempt }}] 를 그대로 쓴다. 인라인 댓글에는 쓰지 않는다.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment,mcp__github_ci__get_ci_status"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git push:*),Read(./.git/**),Read(//proc/**),Bash(gh * --body-file*),Bash(gh * -F *)"

      # green 은 리뷰가 아니다. 이번 실행의 완료 표식이 든 claude[bot] 요약 댓글이 있어야 성공이다.
      - name: Verify review output
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.pre.outputs.start }}
          MARK: "[sw-done:${{ github.run_id }}.${{ github.run_attempt }}]"
        run: |
          set -euo pipefail
          n=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?since=$SINCE&per_page=100" \
                | jq --arg m "$MARK" '[.[] | select(.user.login == "claude[bot]" and (.body | contains($m)))] | length')
          [[ "$n" =~ ^[0-9]+$ ]] || { echo "::error::댓글 수를 읽지 못했다."; exit 1; }
          echo "완료 표식이 든 claude[bot] 요약 댓글: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::완료 표식이 든 리뷰 요약이 없다. Action 은 끝났지만 리뷰는 완료되지 않았다."
            exit 1
          fi
