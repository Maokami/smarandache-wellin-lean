# 기반 CI: AI 없음. 모든 PR (사람·에이전트) 의 독립 검증자다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lean:
    name: Lean build and audits
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Mathlib 은 cache get 으로 받는다. 공리 감사는 라이브러리 SmarandacheWellin 의 모든 모듈에 선언된 모든 것에 대해
      # propext, Classical.choice, Quot.sound 밖의 공리 (sorryAx, native_decide 의 ofReduceBool, 새 axiom) 를 막는다.
      # axiom-audit-root 는 모듈 접두사다 (기본값 = lakefile 의 라이브러리).
      - name: Build, import check, axiom audit
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1 (2026-11-06)
        with:
          build: true
          mk_all-check: true
          axiom-audit: true
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"

      - name: Blueprint ↔ Lean ↔ Audit consistency
        run: python3 -I scripts/check_blueprint.py --write-decls "$RUNNER_TEMP/lean_decls"

      - name: checkdecls (blueprint names exist in Lean)
        run: lake exe checkdecls "$RUNNER_TEMP/lean_decls"

      # 에이전트 PR 은 규칙·장부·빌드 설정·워크플로·검사기를 바꿀 수 없다 (AGENTS.md).
      # 브랜치 이름은 에이전트가 정할 수 있으므로 PR 작성자 (위조 불가) 로도 판단한다.
      # 이 가드는 ci.yml 을 바꾸는 PR 에는 무력하다. 그 경우는 ruleset 의 사람 승인이 막는다.
      - name: Agent PR scope guard
        # Dependabot PR 은 아래 별도 단계가 내용까지 검사한다.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          (startsWith(github.head_ref, 'claude/') ||
           github.event.pull_request.user.type == 'Bot' ||
           github.event.pull_request.user.login != github.repository_owner)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only --no-renames "origin/${BASE_REF}...HEAD" | tee "$RUNNER_TEMP/changed.txt"
          if grep -nE '^(docs/lemma-ledger\.md|README\.md|docs/research-plan\.md|lakefile\.toml|lake-manifest\.json|lean-toolchain|AGENTS\.md|CLAUDE\.md|scripts/check_blueprint\.py|site/|\.github/|\.claude/|\.mcp\.json)' "$RUNNER_TEMP/changed.txt"; then
            echo "::error::에이전트 PR 이 보호된 파일을 바꿨다 (AGENTS.md 의 저자·검증자 규칙)."
            exit 1
          fi

      # Dependabot PR 은 워크플로 파일의 `uses:` 고정 줄만 바꿀 수 있다. 다른 주체가 그 브랜치에 무엇을 섞으면 실패한다.
      - name: Dependabot PR scope
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only --no-renames "origin/${BASE_REF}...HEAD" | tee "$RUNNER_TEMP/changed.txt"
          if grep -vE '^\.github/workflows/[^/]+\.ya?ml$' "$RUNNER_TEMP/changed.txt"; then
            echo "::error::Dependabot PR 이 워크플로 밖의 파일을 바꿨다."
            exit 1
          fi
          git diff -U0 --no-renames "origin/${BASE_REF}...HEAD" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' > "$RUNNER_TEMP/lines.txt" || true
          if grep -vE '^[+-][[:space:]]+(- )?uses: [A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@([0-9a-f]{40}|v[0-9][0-9.]*)([[:space:]]+#.*)?$' "$RUNNER_TEMP/lines.txt"; then
            echo "::error::Dependabot PR 이 uses: 고정 줄 밖의 내용을 바꿨다."
            exit 1
          fi
