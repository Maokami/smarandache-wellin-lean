# 3 단계 (쓰기 가능 AI): 보조정리 사냥꾼. 저장소 소유자가 쓴 lemma-hunt 이슈 하나를 Lean 으로 형식화하고,
# lake build 와 검사가 모두 통과할 때만 draft PR 을 연다. 머지 (승인 1 필수) 와 장부 상태 변경은 사람이 한다.
# 안전장치:
# - 작업 입력은 사전 단계가 소유자 작성 이슈의 제목·본문만 파일로 꺼낸다. 이슈 댓글 (누구나 쓸 수 있음) 은 읽지 않는다.
# - App 토큰은 additional_permissions 로 contents/PR/issues 쓰기 + actions 읽기에 한정한다 (workflows 쓰기 없음).
# - 서브프로세스 환경에서 Anthropic 자격 증명을 지운다 (GitHub 토큰은 남는다).
# 처음에는 수동 실행만 켠다. 몇 번 돌려 본 뒤 schedule 의 주석을 푼다.
name: Claude lemma hunter

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "작업할 lemma-hunt 이슈 번호 (비우면 소유자가 쓴 가장 오래된 열린 이슈)"
        required: false
        default: ""
  # schedule:
  #   - cron: "0 0 * * 3"   # 매주 수요일 09:00 KST

concurrency:
  group: lemma-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      issues: read
      id-token: write
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - name: Fetch trusted task
        id: task
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          OWNER: ${{ github.repository_owner }}
        # 소유자가 쓰고, 본문을 소유자 말고는 고친 적 없는 (editor), 열린 lemma-hunt 이슈만 받는다.
        # 작업 파일에는 번호와 본문만 넣는다 (제목 수정은 editor 에 기록되지 않는다).
        run: |
          set -euo pipefail
          if [ -z "$ISSUE" ]; then
            ISSUE=$(gh issue list -R "$GITHUB_REPOSITORY" --label lemma-hunt --state open --author "$OWNER" --limit 200 \
                      --json number --jq 'map(.number) | min // empty')
          fi
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then echo "작업 없음"; exit 0; fi
          # shellcheck disable=SC2016  # GraphQL 변수 ($o 등) 는 셸이 아니라 GitHub 가 푼다
          gh api graphql -F o="${GITHUB_REPOSITORY%/*}" -F r="${GITHUB_REPOSITORY#*/}" -F n="$ISSUE" -f query='
            query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issue(number:$n){
              number body state author{login} editor{login} lastEditedAt labels(first:20){nodes{name}}}}}' \
            --jq '.data.repository.issue' > "$RUNNER_TEMP/issue.json"
          jq -e --arg o "$OWNER" '
            .author.login == $o and .state == "OPEN" and
            (.editor == null or .editor.login == $o) and
            any(.labels.nodes[]; .name == "lemma-hunt")' "$RUNNER_TEMP/issue.json" > /dev/null
          jq '{number, body}' "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/task.json"
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: steps.task.outputs.issue != ''
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        if: steps.task.outputs.issue != ''
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lean toolchain and Mathlib cache
        if: steps.task.outputs.issue != ''
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1 (2026-11-06)
        with:
          build: true

      - name: Hunt
        if: steps.task.outputs.issue != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_prefix: "claude/"
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            TASK FILE: ${{ runner.temp }}/task.json
            ISSUE: #${{ steps.task.outputs.issue }}

            너는 이 저장소의 저자 에이전트다. AGENTS.md 를 먼저 읽고 그대로 따른다.
            작업은 TASK FILE 에 있는 이슈 하나 (번호와 본문) 뿐이다. 이슈 댓글이나 다른 이슈는 읽지 않는다.

            1. 형식화: 이슈가 말하는 진술을 blueprint/src/content.tex 의 해당 노드와 맞춰 Lean 으로 쓴다.
               증명되지 않은 가정은 이름 붙인 `def ... : Prop` 의 명시적 인자로만 받는다.
               새 선언마다 SmarandacheWellin/Audit.lean 에 #print axioms 줄을, 블루프린트에 노드를 추가한다.
            2. 검사 (모두 통과해야 한다): 새 파일을 만들었으면 먼저 `lake exe mk_all`.
               `lake build` (Audit 출력의 공리가 propext, Classical.choice, Quot.sound 의 부분집합인지 확인),
               `python3 -I scripts/check_blueprint.py --write-decls /tmp/decls`, `lake exe checkdecls /tmp/decls`.
            3. 모두 통과하면 `git switch -c claude/hunt-<짧은-이름>` 으로 브랜치를 만들어 커밋하고
               `git push -u origin claude/hunt-<짧은-이름>` 한 뒤 `gh pr create --draft` 로 PR 을 연다.
               본문: "Refs #이슈번호" (Closes 금지), 새 정리 목록과 블루프린트 라벨, 새 정리의 #print axioms 출력,
               쓴 가정 목록. 한국어로 쓴다. 그 뒤 `gh issue comment` 로 이슈에 PR 링크를 남긴다.
            4. 실패하면 PR 을 열지 않는다. 이슈에 댓글로 시도한 전략, 막힌 지점, 실패가 (i) 수학적 전략의 오류인지
               (ii) 보조명제가 커서 탐색에 실패한 것인지를 적는다.

            금지: AGENTS.md 의 보호 파일 수정. main 에 push. git config 변경. sorry, axiom, native_decide.
            진술을 바꿔 쉬운 문제로 만드는 것.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Read,Edit,MultiEdit,Write,Glob,Grep,Bash(lake build:*),Bash(lake env lean:*),Bash(lake exe checkdecls:*),Bash(lake exe mk_all:*),Bash(python3 -I scripts/check_blueprint.py:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git switch -c claude/*),Bash(git push -u origin claude/*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh issue comment:*)"
            --disallowedTools "Read(./.git/**),Read(//proc/**),Bash(gh * --body-file*),Bash(gh * -F *)"
