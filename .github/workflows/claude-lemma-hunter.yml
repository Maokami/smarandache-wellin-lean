# 3 단계 (쓰기 가능 AI): 보조정리 사냥꾼. 소유자가 쓴 lemma-hunt 이슈 하나를 Lean 으로 형식화하고,
# lake build 와 검사가 모두 통과할 때만 draft PR 을 연다. 머지 (승인 1 필수) 와 장부 상태 변경은 사람이 한다.
# 예약 실행 (하루 1 회) 의 작업 선택은 scripts/hunt_select.py 가 결정적으로 한다 (docs/tooling/2026-11-06-lemma-hunter-schedule.md):
# - 열린 연구 PR (claude/hunt-*) 이 2 개 이상이면 시작하지 않는다.
# - 소유자 작성·소유자 외 편집 없음·열린 lemma-hunt 이슈만. 열린·병합된 연구 PR 이 가리키는 이슈는 고르지 않는다.
# - 같은 본문·같은 실행 기준 SHA (github.sha, 예약 실행은 main) 로 시작한 기록이 있으면 고르지 않는다. 기록은 비싼 작업 전에 mark job 이 남긴다.
# - 명시적 수동 실행 (issue 입력) 은 재시도로 보고 시작 기록 규칙만 건너뛴다.
# 안전장치:
# - AI 에게는 선택된 이슈의 번호와 본문만 파일로 준다. 이슈 댓글은 AI 에게 보이지 않는다.
# - App 토큰은 additional_permissions 로 contents/PR/issues 쓰기 + actions 읽기에 한정한다 (workflows 쓰기 없음).
# - 서브프로세스 환경에서 Anthropic 자격 증명을 지운다 (GitHub 토큰은 남는다).
name: Claude lemma hunter

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "작업할 lemma-hunt 이슈 번호 (재시도 지정). 비우면 예약 실행과 같은 규칙으로 고른다"
        required: false
        default: ""
  schedule:
    - cron: "37 0 * * *"   # 매일 09:37 KST (정각 혼잡을 피한다)

concurrency:
  group: lemma-hunter
  cancel-in-progress: false

jobs:
  # 작업 선택 (AI 없음, 읽기 전용). 판정할 수 없으면 실패하고 아무것도 시작하지 않는다.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      issue: ${{ steps.select.outputs.issue }}
      task_hash: ${{ steps.select.outputs.task_hash }}
      task: ${{ steps.select.outputs.task }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select task
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          OWNER: ${{ github.repository_owner }}
          BASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -I scripts/hunt_select.py select --repo "$GITHUB_REPOSITORY" --owner "$OWNER" --base "$BASE" \
            --issue "$ISSUE" --task-out "$RUNNER_TEMP/task.json" --github-output "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/task.json" ]; then
            echo "task=$(base64 -w0 < "$RUNNER_TEMP/task.json")" >> "$GITHUB_OUTPUT"
          fi

  # 시작 기록 (AI 없음, 쓰기는 issues 하나). 비싼 Lean 준비와 AI 실행 전에 남긴다. 실패하면 hunt 는 시작하지 않는다.
  mark:
    needs: select
    if: needs.select.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record start
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.select.outputs.issue }}
          TASK: ${{ needs.select.outputs.task_hash }}
          BASE: ${{ github.sha }}
          RUN: ${{ github.run_id }}.${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 -I scripts/hunt_select.py record-body --task "$TASK" --base "$BASE" --outcome started \
            --run "$RUN" --run-url "$RUN_URL" > "$RUNNER_TEMP/record.md"
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/record.md"

  hunt:
    needs: [select, mark]
    if: needs.select.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      issues: read
      pull-requests: read   # 출력 확인 단계 (워크플로 토큰) 용
      id-token: write
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      # 인증 준비 확인 (값은 출력하지 않는다. secret 이 비었는지만 본다) 과 시작 시각 기록.
      - name: Check Claude credentials
        id: pre
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret 이 없다. Claude GitHub App 설치와 secret 등록이 필요하다 (README 의 1 회 설정)."
            exit 1
          fi
          echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # select job 이 검증한 번호와 본문만 AI 의 작업 파일로 쓴다 (다시 조회하지 않는다).
      - name: Write task file
        env:
          TASK: ${{ needs.select.outputs.task }}
        run: base64 -d <<<"$TASK" > "$RUNNER_TEMP/task.json"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lean toolchain and Mathlib cache
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1 (2026-11-06)
        with:
          build: true

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 이면 Claude Code 는 bubblewrap 없이 시작하지 않는다.
      # action 은 allowed_non_write_users 가 있을 때만 설치하므로 여기서 같은 방식으로 설치한다 (action.yml 의 단계와 같다).
      - name: Install subprocess isolation (bubblewrap)
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat && break
            echo "apt-get attempt $i failed, retrying..."
            sleep 5
          done
          command -v bwrap
          # Ubuntu 24.04+ 는 AppArmor 로 비특권 user namespace 를 막는다.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Hunt
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_prefix: "claude/"
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            TASK FILE: ${{ runner.temp }}/task.json
            ISSUE: #${{ needs.select.outputs.issue }}

            너는 이 저장소의 저자 에이전트다. AGENTS.md 를 먼저 읽고 그대로 따른다.
            작업은 TASK FILE 에 있는 이슈 하나 (번호와 본문) 뿐이다. 이슈 댓글이나 다른 이슈는 읽지 않는다.

            1. 형식화: 이슈가 말하는 진술을 blueprint/src/content.tex 의 해당 노드와 맞춰 Lean 으로 쓴다.
               증명되지 않은 가정은 이름 붙인 `def ... : Prop` 의 명시적 인자로만 받는다.
               새 선언마다 SmarandacheWellin/Audit.lean 에 #print axioms 줄을, 블루프린트에 노드를 추가한다.
            2. 검사 (모두 통과해야 한다): 새 파일을 만들었으면 먼저 `lake exe mk_all`.
               `lake build` (Audit 출력의 공리가 propext, Classical.choice, Quot.sound 의 부분집합인지 확인),
               `python3 -I scripts/check_blueprint.py --write-decls /tmp/decls`, `lake exe checkdecls /tmp/decls`.
            3. 모두 통과하면 `git switch -c claude/hunt-<짧은-이름>` 으로 브랜치를 만들어 커밋하고
               `git push -u origin claude/hunt-<짧은-이름>` 한 뒤 `gh pr create --draft` 로 PR 을 연다.
               본문: "Refs #이슈번호" (Closes 금지), 새 정리 목록과 블루프린트 라벨, 새 정리의 #print axioms 출력,
               쓴 가정 목록. 한국어로 쓴다. 본문 마지막 줄에 완료 표식 [sw-done:${{ github.run_id }}.${{ github.run_attempt }}] 를 그대로 쓴다.
               그 뒤 `gh issue comment` 로 이슈에 PR 링크를 남긴다 (이 댓글에도 같은 완료 표식).
            4. 실패하면 PR 을 열지 않는다. 이슈에 댓글로 시도한 전략, 막힌 지점, 실패가 (i) 수학적 전략의 오류인지
               (ii) 보조명제가 커서 탐색에 실패한 것인지를 적는다. 댓글 마지막 줄에 완료 표식 [sw-done:${{ github.run_id }}.${{ github.run_attempt }}] 를 그대로 쓴다.

            금지: AGENTS.md 의 보호 파일 수정. main 에 push. git config 변경. sorry, axiom, native_decide.
            진술을 바꿔 쉬운 문제로 만드는 것.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Read,Edit,MultiEdit,Write,Glob,Grep,Bash(lake build:*),Bash(lake env lean:*),Bash(lake exe checkdecls:*),Bash(lake exe mk_all:*),Bash(python3 -I scripts/check_blueprint.py:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git switch -c claude/hunt-*),Bash(git push -u origin claude/hunt-*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh issue comment:*)"
            --disallowedTools "Read(./.git/**),Read(//proc/**),Bash(gh * --body-file*),Bash(gh * -F *)"

      # green 은 결과가 아니다. 성공이려면 둘 중 하나:
      #  (a) 이번 실행 이후 만든 claude/hunt-* 브랜치의 draft PR 로, 본문에 "Refs #이슈" 와 이번 완료 표식이 있다 (draft 가 아니면 실패).
      #  (b) PR 이 없으면, 이슈에 이번 완료 표식이 든 claude[bot] 실패 보고 댓글이 있다.
      - name: Verify hunt output
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.select.outputs.issue }}
          SINCE: ${{ steps.pre.outputs.start }}
          MARK: "[sw-done:${{ github.run_id }}.${{ github.run_attempt }}]"
        run: |
          set -euo pipefail
          gh pr list -R "$GITHUB_REPOSITORY" --state all --limit 50 --json number,headRefName,createdAt,isDraft,body,url > "$RUNNER_TEMP/prs.json"
          linked=$(jq -c --arg s "$SINCE" --arg m "$MARK" --arg r "Refs #$ISSUE" \
            '[.[] | select((.headRefName | startswith("claude/hunt-")) and .createdAt >= $s and (.body | contains($m)) and (.body | contains($r)))]' "$RUNNER_TEMP/prs.json")
          echo "이슈 #$ISSUE 와 연결된 새 PR: $(jq -c 'map({number, isDraft, url})' <<<"$linked")"
          if [ "$(jq length <<<"$linked")" -gt 0 ]; then
            if jq -e 'all(.[]; .isDraft == true)' <<<"$linked" > /dev/null; then exit 0; fi
            echo "::error::연결된 PR 이 draft 가 아니다."
            exit 1
          fi
          c=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments?since=$SINCE&per_page=100" \
                | jq --arg m "$MARK" '[.[] | select(.user.login == "claude[bot]" and (.body | contains($m)))] | length')
          [[ "$c" =~ ^[0-9]+$ ]] || { echo "::error::댓글 수를 읽지 못했다."; exit 1; }
          echo "완료 표식이 든 실패 보고 댓글: $c"
          if [ "$c" -eq 0 ]; then
            echo "::error::연결된 draft PR 도 완료 표식이 든 실패 보고도 없다."
            exit 1
          fi
