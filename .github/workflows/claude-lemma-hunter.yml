# 3 단계 (쓰기 가능 AI): 보조정리 사냥꾼. lemma-hunt 이슈 하나를 골라 Lean 으로 형식화하고,
# lake build 와 검사가 모두 통과할 때만 draft PR 을 연다. 머지와 장부 상태 변경은 사람이 한다.
# 처음에는 수동 실행만 켠다. 몇 번 돌려 본 뒤 schedule 의 주석을 푼다.
name: Claude lemma hunter

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "작업할 lemma-hunt 이슈 번호 (비우면 가장 오래된 열린 이슈)"
        required: false
        default: ""
  # schedule:
  #   - cron: "0 0 * * 3"   # 매주 수요일 09:00 KST

concurrency:
  group: lemma-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lean toolchain and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: true

      - name: Hunt
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_prefix: "claude/"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: ${{ inputs.issue }}

            너는 이 저장소의 저자 에이전트다. AGENTS.md 를 먼저 읽고 그대로 따른다.

            1. 작업 고르기: ISSUE 가 비어 있지 않으면 그 이슈, 비어 있으면
               `gh issue list --label lemma-hunt --state open` 에서 가장 오래된 이슈 하나. 없으면 아무것도 하지 않고 끝낸다.
            2. 형식화: 이슈가 말하는 진술을 blueprint/src/content.tex 의 해당 노드와 맞춰 Lean 으로 쓴다.
               증명되지 않은 가정은 이름 붙인 `def ... : Prop` 의 명시적 인자로만 받는다.
               새 선언마다 SmarandacheWellin/Audit.lean 에 #print axioms 줄을, 블루프린트에 노드를 추가한다.
            3. 검사 (모두 통과해야 한다):
               (새 파일을 만들었으면 먼저 `lake exe mk_all`) `lake build` (Audit 출력의 공리가 propext, Classical.choice, Quot.sound 의 부분집합인지 확인),
               `python3 -I scripts/check_blueprint.py --write-decls /tmp/decls`, `lake exe checkdecls /tmp/decls`.
            4. 모두 통과하면 claude/ 로 시작하는 브랜치에 커밋하고 push 한 뒤 `gh pr create --draft` 로 PR 을 연다.
               본문: 이슈 링크 (Closes 를 쓰지 말고 "Refs #번호"), 새 정리 목록과 블루프린트 라벨, 새 정리의 #print axioms 출력,
               쓴 가정 목록. 한국어로 쓴다. 그 뒤 이슈에 PR 링크를 댓글로 남긴다.
            5. 실패하면 PR 을 열지 않는다. 이슈에 댓글로 시도한 전략, 막힌 지점, 실패가 (i) 수학적 전략의 오류인지
               (ii) 보조명제가 커서 탐색에 실패한 것인지를 적는다.

            금지: docs/lemma-ledger.md, README.md, docs/research-plan.md, lakefile.toml, lake-manifest.json,
            lean-toolchain, .github/ 수정. main 에 직접 push. sorry, axiom, native_decide. 진술을 바꿔 쉬운 문제로 만드는 것.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Read,Edit,MultiEdit,Write,Glob,Grep,Bash(lake build:*),Bash(lake env lean:*),Bash(lake exe checkdecls:*),Bash(lake exe mk_all:*),Bash(python3 -I scripts/check_blueprint.py:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*)"
