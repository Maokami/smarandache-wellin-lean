# PR 현황 보고서와 분류 라벨 (docs/tooling/2026-11-06-pr-triage.md).
# 실행 로직은 continuous-ai-kit 의 재사용 워크플로 pr-triage.yml 로 옮겼다. 전체 커밋 SHA 로 고정한다.
# - collect: AI 없음, 읽기 전용. 열린 PR 의 사실과 관리 라벨 어긋남을 모은다.
# - summarize: Claude, 읽기 전용. 사실이 바뀌었을 때만 우선순위·다음 조치를 구조화 출력으로 낸다.
# - publish: AI 없음. 다시 수집해 낡은 스냅샷이면 쓰지 않고, 관리 라벨 (pr-triage/*) 과 보고서 이슈 하나만 고친다.
#   게시 job만 issues·pull-requests 쓰기를 받는다. PR 병합·종료·브랜치 수정은 없다.
# 라벨·보고서 마커·digest·stale 동작은 기존 scripts/pr_triage.py 와 같다 (.github/continuous-ai/pr-triage.json).
name: Claude PR triage

on:
  schedule:
    - cron: "17 */2 * * *"   # 2 시간마다 (UTC 짝수 시 17 분 = KST 01:17, 03:17, …, 23:17). 정각 혼잡을 피한다
  workflow_dispatch:

concurrency:
  group: claude-pr-triage
  cancel-in-progress: false

permissions: {}

jobs:
  triage:
    # 재사용 워크플로의 job 권한 합집합. 각 job 은 그 안에서 더 좁힌다 (summarize 는 contents 읽기만).
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    uses: Maokami/continuous-ai-kit/.github/workflows/pr-triage.yml@d17b8cf395a9bc6fc48799850f4d80c72386e767
    with:
      config: .github/continuous-ai/pr-triage.json
      default_branch: main
    secrets:
      claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
