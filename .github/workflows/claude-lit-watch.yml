# 2 단계 (읽기 전용 AI): 주간 문헌 감시. 새 항목이 있을 때만 이슈 하나를 연다.
name: Claude literature watch

on:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 09:00 KST
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1

      - name: Watch
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}

            이 저장소의 연구 주제에 관한 새 문헌을 찾는다. 먼저 AGENTS.md, docs/references.md, docs/literature/ 를 읽어
            이미 아는 항목을 파악한다.

            검색 대상 (최근 1 년, arXiv·OEIS·저널):
            - Smarandache–Wellin 수와 소수, 소수를 이어 붙인 수 (prime concatenation), OEIS A019518, A046035, A069151
            - 같은 나머지류의 연속 소수 (Shiu strings, Maynard 의 dense clusters 후속, Banks–Freiberg–Turnage-Butterbaugh 후속)
            - 연속 소수의 나머지류 편향 (Lemke Oliver–Soundararajan 후속)
            - 위와 관련된 Lean/Mathlib 형식화

            `gh issue list --label lit-watch --state all --limit 50` 으로 이전 보고와 겹치지 않게 한다.
            새 항목이 없으면 아무것도 만들지 않고 끝낸다.
            새 항목이 있으면 `gh issue create --label lit-watch` 로 이슈 하나를 연다. 제목은 "[문헌 감시] YYYY-MM-DD".
            항목마다 서지 정보, 링크, 이 저장소의 어느 가정·노드 (H3, IT(q), Q1, Q2, 목표 추측) 와 관련되는지 두세 문장으로 쓴다.
            확인하지 못한 내용은 확인하지 못했다고 쓴다. 한국어로 쓴다.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,WebSearch,WebFetch,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*)"
